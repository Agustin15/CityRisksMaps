<svg width="80" height="80" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- gradientes por cara -->
    <linearGradient id="faceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42A5F5"></stop>
      <stop offset="100%" stop-color="#1E88E5"></stop>
    </linearGradient>

    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E88E5"></stop>
      <stop offset="100%" stop-color="#0D47A1"></stop>
    </linearGradient>

    <linearGradient id="faceBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565C0"></stop>
      <stop offset="100%" stop-color="#0D47A1"></stop>
    </linearGradient>

    <!-- fondo -->
    <linearGradient id="white3D" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#e0e0e0"></stop>
    </linearGradient>

    <!-- sombra -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="black" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- fondo (flecha más grande) -->
  <path d="M32 6 L54 48 L32 40 L10 48 Z" fill="url(#white3D)" filter="url(#shadow)"></path>

  <!-- cara izquierda -->
  <path d="M32 14 L18 42 L32 36 Z" fill="url(#faceLeft)"></path>

  <!-- cara derecha -->
  <path d="M32 14 L46 42 L32 36 Z" fill="url(#faceRight)"></path>

  <!-- cara inferior (profundidad) -->
  <path d="M18 42 L32 36 L46 42 L32 38 Z" fill="url(#faceBottom)"></path>

  <!-- brillo -->
  <path d="M32 14 L36 26 L32 24 Z" fill="rgba(255,255,255,0.35)"></path>

</svg>