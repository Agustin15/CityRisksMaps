<svg viewBox="0 0 1440 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e3453"></stop>
      <stop offset="100%" stop-color="#313e7a"></stop>
    </linearGradient>

    <clipPath id="waveClip">
      <path d="M0,0H1440
               C1350,70 1200,120 1000,130
               C800,140 650,80 450,90
               C250,100 120,160 0,240
               Z"></path>
    </clipPath>
  </defs>

  <!-- Wave principal -->
  <path fill="url(#waveGradient)" d="M0,0H1440
           C1350,70 1200,120 1000,130
           C800,140 650,80 450,90
           C250,100 120,160 0,240
           Z"></path>

  <!-- Patrones internos -->
  <g clip-path="url(#waveClip)">
    <!-- Rectángulo redondeado -->
    <rect x="1020" y="-30" width="220" height="160" rx="40" fill="#5b79c8" opacity="0.12" transform="rotate(-20 1020 -30)"></rect>

    <!-- Banda diagonal -->
    <rect x="850" y="-50" width="30" height="350" fill="white" opacity="0.08" transform="rotate(-20 850 -50)"></rect>

    <!-- Banda diagonal 2 -->
    <rect x="910" y="-50" width="60" height="350" fill="#000" opacity="0.06" transform="rotate(-20 910 -50)"></rect>

    <!-- Círculo grande -->
    <circle cx="250" cy="170" r="90" fill="#ffffff" opacity="0.05"></circle>

    <!-- Círculo pequeño -->
    <circle cx="1200" cy="80" r="35" fill="#ffffff" opacity="0.04"></circle>
  </g>
</svg>